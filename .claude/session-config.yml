# session-config.yml — read by /handover + /start-fresh.
# Re-run /session-setup to amend a field or add a track.

project_prefix: "DOS"            # session tags become DOS:O<N> / DOS:R<N> / DOS:P<N>

# Shared across all tracks
memory_project_file: project_deliveryos.md
worktree_pattern: "agent-*"
worktree_dir: .claude/worktrees

scan_excludes:
  - docs/archive/**
  - docs/deprecated/**
  - docs/build/**

# deploy_command: skipped — no ship pipeline yet (pre-build)

tracks:
  O:
    label: "Documentation"
    handover_path: docs/planning/PLANNING_STATUS.md
    history_dir: docs/planning/history/
    # project_plan_path omitted — PLANNING_STATUS.md absorbs backlog
    # sanity_checks: none
    # bug_list: disabled

  R:
    label: "Development"
    handover_path: docs/build/BUILD_STATUS.md
    history_dir: docs/build/history/
    project_plan_path: docs/BUILD-PLAN.md   # static 14-week roadmap, separate from rolling BUILD_STATUS.md
    sanity_checks:
      - name: "clean working tree"
        cmd: "git status --porcelain"
      - name: "scaffold state"
        cmd: "ls extension/src/ && ls extension/package.json webview/package.json contracts/package.json package.json 2>&1"
      - name: "lint (soft)"
        cmd: "test -f package.json && npm run -s lint || echo 'lint: not yet wired'"
    bug_list:
      enabled: true
      count_cmd: |
        jq '.bugs | length' docs/build/bugs.json
      titles_cmd: |
        jq -r '.bugs[] | "  - \(.id // "?"): \(.title // "(no title)")"' docs/build/bugs.json

  P:
    label: "Project Management"
    handover_path: docs/pm/PM_STATUS.md
    history_dir: docs/pm/history/
    # project_plan_path omitted — PM_STATUS.md absorbs backlog
    # sanity_checks: none
    # bug_list: disabled
