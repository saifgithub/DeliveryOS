name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build workspaces
        run: npm run build

      - name: Package extension
        id: package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Run the workspace `package` script so the `prepackage` lifecycle
          # (cp ../LICENSE + ../README.md into extension/) runs before vsce.
          # Without prepackage, the .vsix is missing LICENSE.txt + readme.md
          # and vsce emits a warning.
          npm -w deliveryos run package
          # vsce writes deliveryos-<pkgVersion>.vsix into extension/.
          # Move/rename so the asset matches the tag (in case the two ever
          # drift mid-release — they should match, but defend against it).
          PKG_VSIX=$(ls extension/deliveryos-*.vsix | head -1)
          OUT_VSIX="deliveryos-${VERSION}.vsix"
          mv "$PKG_VSIX" "$OUT_VSIX"
          echo "vsix=${OUT_VSIX}" >> "$GITHUB_OUTPUT"

      - name: Compute SHA-256 sums
        run: |
          # Write hashes using the BASENAMES that users see after downloading
          # from the GitHub release page. install.sh / install.ps1 live under
          # scripts/ in the repo but are uploaded as bare filenames, so the
          # SHA256SUMS.txt entries must match.
          sha256sum "${{ steps.package.outputs.vsix }}" > SHA256SUMS.txt
          ( cd scripts && sha256sum install.sh install.ps1 ) >> SHA256SUMS.txt
          if [ -f demo.mp4 ]; then sha256sum demo.mp4 >> SHA256SUMS.txt; fi
          echo "--- SHA256SUMS.txt ---"
          cat SHA256SUMS.txt

      - name: Ensure RELEASE_NOTES.md exists
        run: |
          if [ ! -f RELEASE_NOTES.md ]; then
            echo "RELEASE_NOTES.md missing — generating a minimal default for ${GITHUB_REF_NAME}." >&2
            printf 'DeliveryOS %s — sideloadable .vsix release.\n' "$GITHUB_REF_NAME" > RELEASE_NOTES.md
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS="${{ steps.package.outputs.vsix }} scripts/install.sh scripts/install.ps1 SHA256SUMS.txt"
          if [ -f demo.mp4 ]; then ASSETS="$ASSETS demo.mp4"; fi
          # shellcheck disable=SC2086
          gh release create "$GITHUB_REF_NAME" $ASSETS \
            --title "DeliveryOS $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
