# needles.conf — DeliveryOS's grep needles for check_bindings.sh checks 4 and 5.
# TIER B: written once per project, never copied onward. It lives outside check_bindings.sh because
# these are project VALUES and that script is tier A — a tier-A file carrying this project's own
# name would fail its own check.
#
# Extended-regex alternations, sourced by check_bindings.sh. Every spelling and casing that could
# appear in a file: a form omitted here is a form the check cannot catch.
# An empty value is a FAILURE, not a skip.

# This project's name, in every form. Includes its artifact extension and the two process acronyms,
# which are equally this project's and equally wrong in a portable file.
NEEDLE_PROJECT="DeliveryOS|deliveryos|DOS:|\.vsix|MABP|MHBP"

# Hosts, domains and environment names. This project has no deployed host; these catch a repo URL
# or a LAN endpoint pasted in from the model-availability notes.
NEEDLE_HOSTS="github\.com/[A-Za-z]|192\.168\.|100\.94\."

# The stakeholder.
NEEDLE_PERSON="Saiful|saiful"

# <HARNESS_TERMS> — every harness, CLI, tool and model name in play here, plus the harness-specific
# affordances that read as generic until you try to run them elsewhere. This is the needle set that
# makes "any implementation can fill any role" checkable rather than aspirational.
NEEDLE_HARNESS="claude|ultracode|opus|sonnet|haiku|gemini|kimi|antigravity|copilot|SendMessage|PreCompact|/compact|--session-id|run_in_background"
